<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="YoApi">
  <defs>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#11161d"/>
      <stop offset="1" stop-color="#0b0f14"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- instrument case -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#case)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="103.5" fill="none" stroke="#34d6c8" stroke-opacity="0.14" stroke-width="1"/>

  <!-- hairline registration grid -->
  <g stroke="#34d6c8" stroke-opacity="0.07" stroke-width="1">
    <line x1="176" y1="72" x2="176" y2="440"/>
    <line x1="336" y1="72" x2="336" y2="440"/>
    <line x1="88" y1="176" x2="424" y2="176"/>
    <line x1="88" y1="336" x2="424" y2="336"/>
  </g>

  <!-- calibration signal dot -->
  <rect x="118" y="120" width="40" height="40" rx="10" fill="#34d6c8" filter="url(#glow)"/>

  <!-- execute caret — request fired -->
  <path d="M150 214 L286 300 L150 386" fill="none" stroke="#34d6c8" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- response readout bar -->
  <rect x="316" y="279" width="66" height="42" rx="12" fill="#34d6c8"/>
</svg>
